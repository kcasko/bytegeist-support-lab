AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: ByteGeist Support Lab backend

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - x86_64
    Timeout: 10
    MemorySize: 128

Resources:

  ScenarioTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ByteGeistSupportLabScenarios
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: scenarioId
          AttributeType: S

      KeySchema:
        - AttributeName: scenarioId
          KeyType: HASH

  TutorSessionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ByteGeistSupportLabTutorSessions
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S

      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH

      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  SupportLabApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

      CorsConfiguration:
        AllowOrigins:
          - "*"

        AllowMethods:
          - GET
          - POST
          - OPTIONS

        AllowHeaders:
          - Content-Type

  RunCommandFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bytegeist-support-lab-run-command
      CodeUri: ../backend/run-command/
      Handler: index.handler

      Environment:
        Variables:
          SCENARIO_TABLE: !Ref ScenarioTable
          SESSION_TABLE: !Ref TutorSessionTable

      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ScenarioTable

        - DynamoDBCrudPolicy:
            TableName: !Ref TutorSessionTable

      Events:
        RunCommand:
          Type: HttpApi
          Properties:
            ApiId: !Ref SupportLabApi
            Path: /scenarios/{id}/command
            Method: POST
            PayloadFormatVersion: "2.0"

  ListScenariosFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bytegeist-support-lab-list-scenarios
      CodeUri: ../backend/list-scenarios/
      Handler: index.handler

      Environment:
        Variables:
          SCENARIO_TABLE: !Ref ScenarioTable

      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ScenarioTable

      Events:
        ListScenarios:
          Type: HttpApi
          Properties:
            ApiId: !Ref SupportLabApi
            Path: /scenarios
            Method: GET
            PayloadFormatVersion: "2.0"

  GetScenarioFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bytegeist-support-lab-get-scenario
      CodeUri: ../backend/get-scenario/
      Handler: index.handler

      Environment:
        Variables:
          SCENARIO_TABLE: !Ref ScenarioTable

      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ScenarioTable

      Events:
        GetScenario:
          Type: HttpApi
          Properties:
            ApiId: !Ref SupportLabApi
            Path: /scenarios/{id}
            Method: GET
            PayloadFormatVersion: "2.0"

  StartSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bytegeist-support-lab-start-session
      CodeUri: ../backend/start-session/
      Handler: index.handler

      Environment:
        Variables:
          SCENARIO_TABLE: !Ref ScenarioTable
          SESSION_TABLE: !Ref TutorSessionTable

      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ScenarioTable

        - DynamoDBCrudPolicy:
            TableName: !Ref TutorSessionTable

      Events:
        StartSession:
          Type: HttpApi
          Properties:
            ApiId: !Ref SupportLabApi
            Path: /scenarios/{id}/session
            Method: POST
            PayloadFormatVersion: "2.0"

  SubmitScenarioFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bytegeist-support-lab-submit-scenario
      CodeUri: ../backend/submit-scenario/
      Handler: index.handler
      Timeout: 20

      Environment:
        Variables:
          SCENARIO_TABLE: !Ref ScenarioTable

      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ScenarioTable

        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.nova-micro-v1:0"

      Events:
        SubmitScenario:
          Type: HttpApi
          Properties:
            ApiId: !Ref SupportLabApi
            Path: /scenarios/{id}/submit
            Method: POST
            PayloadFormatVersion: "2.0"

  CoachScenarioFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bytegeist-support-lab-coach-scenario
      CodeUri: ../backend/coach-scenario/
      Handler: index.handler
      Timeout: 20

      Environment:
        Variables:
          SCENARIO_TABLE: !Ref ScenarioTable
          SESSION_TABLE: !Ref TutorSessionTable

      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ScenarioTable

        - DynamoDBCrudPolicy:
            TableName: !Ref TutorSessionTable

        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.nova-micro-v1:0"

      Events:
        CoachScenario:
          Type: HttpApi
          Properties:
            ApiId: !Ref SupportLabApi
            Path: /scenarios/{id}/coach
            Method: POST
            PayloadFormatVersion: "2.0"

Outputs:

  ApiUrl:
    Description: ByteGeist Support Lab API URL
    Value: !Sub "https://${SupportLabApi}.execute-api.${AWS::Region}.amazonaws.com"

  ScenarioTableName:
    Description: DynamoDB scenario table
    Value: !Ref ScenarioTable

  TutorSessionTableName:
    Description: AI tutor session table
    Value: !Ref TutorSessionTable

  RunCommandFunctionArn:
    Description: Run Command Lambda ARN
    Value: !GetAtt RunCommandFunction.Arn

  StartSessionFunctionArn:
    Description: Start Session Lambda ARN
    Value: !GetAtt StartSessionFunction.Arn

  CoachScenarioFunctionArn:
    Description: AI Coach Lambda ARN
    Value: !GetAtt CoachScenarioFunction.Arn