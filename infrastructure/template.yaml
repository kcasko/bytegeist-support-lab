AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: ByteGeist Support Lab backend

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - x86_64
    Timeout: 10
    MemorySize: 128

Resources:

  ScenarioTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ByteGeistSupportLabScenarios
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: scenarioId
          AttributeType: S
      KeySchema:
        - AttributeName: scenarioId
          KeyType: HASH

  SupportLabApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type

  RunCommandFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bytegeist-support-lab-run-command
      CodeUri: ../backend/run-command/
      Handler: index.handler

      Environment:
        Variables:
          SCENARIO_TABLE: !Ref ScenarioTable

      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ScenarioTable

      Events:
        RunCommand:
          Type: HttpApi
          Properties:
            ApiId: !Ref SupportLabApi
            Path: /scenarios/{id}/command
            Method: POST
            PayloadFormatVersion: "2.0"

  ListScenariosFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bytegeist-support-lab-list-scenarios
      CodeUri: ../backend/list-scenarios/
      Handler: index.handler

      Environment:
        Variables:
          SCENARIO_TABLE: !Ref ScenarioTable

      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ScenarioTable

      Events:
        ListScenarios:
          Type: HttpApi
          Properties:
            ApiId: !Ref SupportLabApi
            Path: /scenarios
            Method: GET
            PayloadFormatVersion: "2.0"

  GetScenarioFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bytegeist-support-lab-get-scenario
      CodeUri: ../backend/get-scenario/
      Handler: index.handler

      Environment:
        Variables:
          SCENARIO_TABLE: !Ref ScenarioTable

      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ScenarioTable

      Events:
        GetScenario:
          Type: HttpApi
          Properties:
            ApiId: !Ref SupportLabApi
            Path: /scenarios/{id}
            Method: GET
            PayloadFormatVersion: "2.0"

  SubmitScenarioFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bytegeist-support-lab-submit-scenario
      CodeUri: ../backend/submit-scenario/
      Handler: index.handler

      Environment:
        Variables:
          SCENARIO_TABLE: !Ref ScenarioTable

      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ScenarioTable

      Events:
        SubmitScenario:
          Type: HttpApi
          Properties:
            ApiId: !Ref SupportLabApi
            Path: /scenarios/{id}/submit
            Method: POST
            PayloadFormatVersion: "2.0"

Outputs:

  ApiUrl:
    Description: ByteGeist Support Lab API URL
    Value: !Sub "https://${SupportLabApi}.execute-api.${AWS::Region}.amazonaws.com"

  ScenarioTableName:
    Description: DynamoDB scenario table
    Value: !Ref ScenarioTable

  RunCommandFunctionArn:
    Description: Run Command Lambda ARN
    Value: !GetAtt RunCommandFunction.Arn